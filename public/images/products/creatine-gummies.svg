<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Creatine gummies bottle</title>
  <desc id="desc">Flat B2B illustration of a creatine gummies bottle</desc>
  <rect width="640" height="640" rx="48" fill="#F0F9FF"/>
  <ellipse cx="320" cy="560" rx="160" ry="18" fill="#CBD5E1" opacity="0.55"/>
  <!-- bottle body -->
  <rect x="210" y="180" width="220" height="340" rx="36" fill="#0EA5E9"/>
  <rect x="210" y="180" width="220" height="340" rx="36" fill="url(#g1)" opacity="0.35"/>
  <!-- label -->
  <rect x="230" y="260" width="180" height="180" rx="16" fill="#F8FAFC"/>
  <rect x="250" y="290" width="140" height="14" rx="7" fill="#0F766E"/>
  <rect x="270" y="320" width="100" height="10" rx="5" fill="#94A3B8"/>
  <rect x="280" y="345" width="80" height="10" rx="5" fill="#94A3B8"/>
  <!-- gummy dots on label -->
  <circle cx="290" cy="400" r="14" fill="#2DD4BF"/>
  <circle cx="320" cy="395" r="16" fill="#14B8A6"/>
  <circle cx="352" cy="400" r="14" fill="#5EEAD4"/>
  <!-- neck -->
  <rect x="270" y="140" width="100" height="50" rx="12" fill="#0284C7"/>
  <!-- cap -->
  <rect x="255" y="100" width="130" height="50" rx="14" fill="#0F766E"/>
  <rect x="270" y="112" width="100" height="8" rx="4" fill="#99F6E4" opacity="0.5"/>
  <defs>
    <linearGradient id="g1" x1="210" y1="180" x2="430" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0369A1" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
</svg>
