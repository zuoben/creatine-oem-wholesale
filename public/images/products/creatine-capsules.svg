<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Creatine capsules jar</title>
  <desc id="desc">Flat B2B illustration of a creatine capsules bottle</desc>
  <rect width="640" height="640" rx="48" fill="#F0FDFA"/>
  <ellipse cx="320" cy="560" rx="155" ry="18" fill="#CBD5E1" opacity="0.55"/>
  <!-- jar -->
  <rect x="220" y="200" width="200" height="320" rx="28" fill="#14B8A6"/>
  <rect x="220" y="200" width="200" height="320" rx="28" fill="url(#g3)" opacity="0.35"/>
  <!-- label -->
  <rect x="240" y="280" width="160" height="160" rx="14" fill="#F8FAFC"/>
  <rect x="260" y="310" width="120" height="12" rx="6" fill="#0F766E"/>
  <rect x="275" y="338" width="90" height="9" rx="4" fill="#94A3B8"/>
  <!-- capsule icons -->
  <g transform="translate(280 380)">
    <rect x="0" y="8" width="36" height="18" rx="9" fill="#5EEAD4"/>
    <rect x="18" y="8" width="18" height="18" rx="9" fill="#0D9488"/>
    <rect x="48" y="8" width="36" height="18" rx="9" fill="#99F6E4"/>
    <rect x="66" y="8" width="18" height="18" rx="9" fill="#14B8A6"/>
  </g>
  <!-- neck -->
  <rect x="270" y="155" width="100" height="55" rx="10" fill="#0D9488"/>
  <!-- cap -->
  <rect x="255" y="115" width="130" height="50" rx="12" fill="#115E59"/>
  <rect x="270" y="128" width="100" height="8" rx="4" fill="#5EEAD4" opacity="0.45"/>
  <defs>
    <linearGradient id="g3" x1="220" y1="200" x2="420" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0F766E" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
</svg>
